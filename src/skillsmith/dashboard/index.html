<!doctype html>
<!-- Skillsmith dashboard. WS6.2: big-screen story view (DEMO.md "Big-screen layout").
     WS6.3: task input (POST /task) and the human gate (POST /approve: Approve, or Reject with a note).
     WS6.4: the detail drawer ("Details"): annotated key frames (served by GET /frame), the phase
     table, Droid's tool calls and checks, every permission decision (refusals highlighted).
     Renders ONLY from the SSE stream (docs/INTERFACES.md §7). Open /?replay=<run_id>&speed=2
     to replay a recorded run. The reducer in <script id="story-reducer"> is pure (no DOM) so
     tests/ws6 can run it under node. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skillsmith</title>
<style>
  body { font: 18px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  header { padding: 12px 28px; background: #222; display: flex; gap: 16px; align-items: center; }
  #mode { padding: 2px 10px; border-radius: 4px; background: #2a6; font-weight: 600; }
  #mode.replay { background: #c80; }
  #status { color: #999; }
  main { padding: 20px 28px; display: grid; gap: 18px; max-width: 1400px; }
  .label { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  #task { font-size: 34px; font-weight: 600; }
  #task.empty { color: #555; }
  #banner { font-size: 44px; font-weight: 800; padding: 18px 24px; border-radius: 10px; background: #333; }
  #banner .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 6px; opacity: .9; }
  #banner.idle { background: #2a2a2a; color: #777; }
  #banner.run { background: #234; }
  #banner.fail { background: #922; }
  #banner.repair { background: #535; }
  #banner.wait { background: #a70; }
  #banner.pass { background: #1a7a3a; }
  #banner.error { background: #600; }
  #droid { font-size: 26px; }
  #droid .via { color: #9a9; font-size: 16px; margin-left: 8px; }
  #change { color: #bbb; font-size: 18px; }
  #diff { font: 20px/1.35 ui-monospace, monospace; background: #1a1a1a; border-radius: 8px;
          padding: 10px 16px; margin: 0; white-space: pre-wrap; word-break: break-all; }
  #diff .add { color: #6e6; } #diff .del { color: #f77; } #diff .more { color: #777; }
  #gates { display: flex; gap: 22px; }
  .gate { display: flex; align-items: center; gap: 10px; font-size: 24px; }
  .light { width: 26px; height: 26px; border-radius: 50%; background: #444; }
  .gate.ok .light { background: #2d2; box-shadow: 0 0 12px #2d2; }
  .gate.fail .light { background: #e33; box-shadow: 0 0 12px #e33; }
  .gate .detail { color: #999; font-size: 15px; max-width: 320px; }
  #approval { display: flex; gap: 18px; align-items: center; font-size: 22px; }
  #approve { font-size: 30px; font-weight: 700; padding: 14px 40px; border: 0; border-radius: 10px;
             background: #2a6; color: #fff; cursor: pointer; }
  #approve:disabled { background: #333; color: #777; cursor: default; }
  #reject { font-size: 20px; padding: 10px 22px; border: 0; border-radius: 8px; background: #833; color: #fff; cursor: pointer; }
  #note { font-size: 18px; padding: 8px 10px; width: 320px; background: #1a1a1a; color: #eee; border: 1px solid #444; border-radius: 6px; }
  #task-form { display: flex; gap: 10px; margin-top: 8px; }
  #task-input { flex: 1; font-size: 20px; padding: 8px 12px; background: #1a1a1a; color: #eee; border: 1px solid #444; border-radius: 6px; }
  #task-form button { font-size: 20px; padding: 8px 22px; border: 0; border-radius: 6px; background: #246; color: #fff; cursor: pointer; }
  #task-form button:disabled { background: #333; color: #777; cursor: default; }
  #task-msg { color: #f99; font-size: 16px; }
  .hidden { display: none !important; }
  #drawer-toggle { margin-left: auto; font-size: 16px; padding: 6px 16px; border: 0; border-radius: 6px;
                   background: #345; color: #fff; cursor: pointer; }
  #drawer-toggle .refused { color: #f99; font-weight: 700; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 55vw); overflow: auto;
            background: #181818; border-left: 1px solid #333; padding: 14px 22px 40px; font-size: 15px;
            box-shadow: -8px 0 24px #000a; }
  #drawer h2 { font-size: 15px; color: #888; text-transform: uppercase; letter-spacing: .08em; margin: 20px 0 8px; }
  #drawer .close { float: right; font-size: 20px; background: none; border: 0; color: #aaa; cursor: pointer; }
  #drawer .empty { color: #555; }
  #frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .frame { margin: 0; border: 3px solid #2a6; border-radius: 6px; overflow: hidden; background: #000; }
  .frame.bad { border-color: #e33; }
  .frame img { width: 100%; display: block; }
  .frame figcaption { padding: 4px 8px; font-size: 13px; color: #ccc; background: #222; }
  #drawer table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  #drawer td, #drawer th { text-align: left; padding: 3px 8px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
  #drawer th { color: #888; font-weight: 400; }
  #drawer .caption { color: #aaa; margin: 6px 0 2px; }
  #drawer span.ok { color: #6e6; } #drawer span.bad { color: #f77; }
  #drawer tr.failed, .perm.refused { background: #3a1616; }
  .step { padding: 4px 0; border-bottom: 1px solid #222; }
  .step .kind { display: inline-block; min-width: 56px; color: #6cf; }
  .step pre { margin: 2px 0 0 56px; font: 12px ui-monospace, monospace; color: #999; white-space: pre-wrap; word-break: break-all; }
  .perm .why { color: #bbb; }
  details { color: #999; }
  #log { font: 12px ui-monospace, monospace; max-height: 260px; overflow: auto; }
  .ev { padding: 1px 0; border-bottom: 1px solid #222; white-space: pre-wrap; word-break: break-all; }
  .ev .type { color: #6cf; display: inline-block; min-width: 170px; }
</style>
</head>
<body>
<header><strong>Skillsmith</strong><span id="mode">LIVE</span><span id="status">connecting…</span>
  <button id="drawer-toggle" type="button">Details</button></header>
<aside id="drawer" class="hidden">
  <button class="close" id="drawer-close" type="button" title="close">✕</button>
  <h2>Annotated key frames</h2><div id="frames"></div>
  <h2>Phase checks</h2><div id="phases"></div>
  <h2>Permission decisions</h2><div id="permissions"></div>
  <h2>Droid tool calls</h2><div id="steps"></div>
  <h2>Droid session</h2><div id="session"></div>
</aside>
<main>
  <section><div class="label">Task</div><div id="task" class="empty">waiting for a task…</div>
    <form id="task-form"><input id="task-input" placeholder="stack the blue cup on the red cup" autocomplete="off">
      <button id="task-run" type="submit">Run</button></form>
    <div id="task-msg"></div>
  </section>
  <section id="banner" class="idle">IDLE</section>
  <section id="droid-box" class="hidden">
    <div class="label">Droid <span id="via" class="via"></span></div>
    <div id="droid"></div>
    <div id="change"></div>
  </section>
  <section id="diff-box" class="hidden">
    <div class="label">The change <span id="diff-versions"></span></div>
    <pre id="diff"></pre>
  </section>
  <section>
    <div class="label">Gates</div>
    <div id="gates"></div>
  </section>
  <section id="approval">
    <button id="approve" disabled>Approve</button>
    <span id="reject-box" class="hidden"><input id="note" placeholder="why not? (Droid reads this)">
      <button id="reject">Reject</button></span>
    <span id="approval-text"></span>
  </section>
  <details><summary>event log</summary><div id="log"></div></details>
</main>

<script id="story-reducer">
// Pure: story state from events. No DOM here (tests run this under node).
const GATES = ["static", "sim", "safety"];
const DIFF_LINES = 5;

function initialState() {
  return {
    run_id: null, task: null, env: null, skill: null, version: null, round: 0,
    banner: { kind: "idle", text: "IDLE", sub: "" },
    attempt: null,            // {env, skill, version, classification, finished}
    droid: null,              // {round, via, diagnosis, change, confidence, message}
    diff: null,               // {old_version, new_version, lines: [{kind, text}], more}
    gates: Object.fromEntries(GATES.map((g) => [g, { state: "pending", detail: "" }])),
    approval: null,           // {state: pending|approved|rejected, kind: approval|reset, title, note}
    saved: null, lesson: null, finished: null,
    drawer: initialDrawer(),
  };
}

// The detail drawer (WS6.4): everything behind the click, kept for the whole run.
function initialDrawer() {
  return {
    attempts: [],             // [{env, skill, version, ok, phases: [PhaseCheck], classification}]
    session: null,            // {round, via, autonomy, disabled_tools, workspace, tools}
    steps: [],                // [{kind: call|result|check, round, name, ok, text}]
    permissions: [],          // [{round, action, target, allowed, reason}]
  };
}

const STEP_TEXT = 400;

function clip(s, max = STEP_TEXT) {
  const text = typeof s === "string" ? s : s == null ? "" : JSON.stringify(s);
  return text.length > max ? text.slice(0, max - 1) + "…" : text;
}

// Key frames are the annotated images the analysis attached to each phase check.
function keyframes(drawer) {
  const out = [];
  drawer.attempts.forEach((a, i) => a.phases.forEach((p) => {
    if (p.frame_path) out.push({ attempt: i + 1, version: a.version, phase: p.phase, ok: p.ok, detail: p.detail, path: p.frame_path });
  }));
  return out;
}

function onLastAttempt(drawer, update) {
  const attempts = drawer.attempts.length ? drawer.attempts.slice()
    : [{ env: null, skill: null, version: null, ok: null, phases: [], classification: null }];
  attempts[attempts.length - 1] = update({ ...attempts[attempts.length - 1] });
  return { ...drawer, attempts };
}

function reduceDrawer(drawer, e) {
  const d = e.data || {};
  switch (e.type) {
    case "attempt.started":
      return { ...drawer, attempts: [...drawer.attempts,
        { env: d.env, skill: d.skill, version: d.version, ok: null, phases: [], classification: null }] };
    case "phase.check":
      return onLastAttempt(drawer, (a) => ({ ...a, phases: [...a.phases, d] }));
    case "attempt.classified":
      return onLastAttempt(drawer, (a) => ({ ...a, classification: d }));
    case "attempt.finished":
      return onLastAttempt(drawer, (a) => ({ ...a, ok: !!d.ok }));
    case "droid.started":
      return { ...drawer, session: { tools: (drawer.session && drawer.session.tools) || [], round: d.round, via: d.via,
                                     autonomy: d.autonomy, disabled_tools: d.disabled_tools || [], workspace: d.workspace } };
    case "droid.tools":
      return { ...drawer, session: { ...(drawer.session || {}), tools: d.tools || [] } };
    case "droid.tool_call":
      return { ...drawer, steps: [...drawer.steps, { kind: "call", round: d.round, name: d.name, ok: null, text: clip(d.input) }] };
    case "droid.tool_result":
      return { ...drawer, steps: [...drawer.steps, { kind: "result", round: d.round, name: d.tool, ok: !d.is_error, text: clip(d.content) }] };
    case "droid.check":
      return { ...drawer, steps: [...drawer.steps, { kind: "check", round: d.round, name: d.tool, ok: !!d.ok,
                                                     text: clip([d.run != null ? `run ${d.run}` : "", d.reason || ""].filter(Boolean).join(": ")) }] };
    case "droid.permission":
      return { ...drawer, permissions: [...drawer.permissions,
        { round: d.round, action: d.action, target: clip(d.target, 200), allowed: !!d.allowed, reason: d.reason || "" }] };
    default:
      return drawer;
  }
}

function firstLine(s, max = 160) {
  const line = String(s || "").split("\n")[0];
  return line.length > max ? line.slice(0, max - 1) + "…" : line;
}

function failBanner(c) {
  const where = c.call_index != null ? ` at call #${c.call_index}` : c.phase ? ` in ${c.phase}` : "";
  const bucket = c.bucket === "environment" ? " · needs a human, not Droid"
    : c.bucket === "unknown" ? " · unknown, Droid gets everything" : "";
  return { kind: "fail", text: `FAIL · ${c.cls}${where}`, sub: firstLine(c.summary) + bucket };
}

function shortDiff(diff) {
  const changed = String(diff || "").split("\n")
    .filter((l) => (l.startsWith("+") || l.startsWith("-")) && !l.startsWith("+++") && !l.startsWith("---"))
    .map((l) => ({ kind: l[0] === "+" ? "add" : "del", text: l }));
  return { lines: changed.slice(0, DIFF_LINES), more: Math.max(changed.length - DIFF_LINES, 0) };
}

// A reset request gets no approval.decided event; the loop moving on means it was answered.
const RESET_DONE = ["scene.observed", "repair.started", "attempt.started", "run.finished"];

function reduce(s, e) {
  if (s.approval && s.approval.kind === "reset" && s.approval.state === "pending" && RESET_DONE.includes(e.type)) {
    s = { ...s, approval: { ...s.approval, state: "approved" } };
  }
  s = reduceEvent(s, e);
  return { ...s, drawer: reduceDrawer(s.drawer || initialDrawer(), e) };
}

function reduceEvent(s, e) {
  const d = e.data || {};
  switch (e.type) {
    case "run.started":
      return { ...initialState(), run_id: e.run_id || null, task: (d.task && d.task.text) || null,
               banner: { kind: "run", text: "STARTING", sub: "" } };
    case "plan.selected":
      return { ...s, skill: d.skill, version: d.version };
    case "attempt.started":
      return { ...s, env: d.env, skill: d.skill, version: d.version,
               attempt: { env: d.env, skill: d.skill, version: d.version, classification: null, finished: false },
               banner: { kind: "run", text: `RUNNING · ${d.skill} v${d.version} on ${d.env}`, sub: "" } };
    case "attempt.classified": {
      const attempt = { ...(s.attempt || {}), classification: d };
      return { ...s, attempt, banner: failBanner(d) };
    }
    case "attempt.finished": {
      const attempt = { ...(s.attempt || {}), finished: true };
      if (d.ok) {
        return { ...s, attempt, banner: { kind: "pass", text: `PASS · ${d.skill} v${d.version} on ${d.env}`, sub: "" } };
      }
      const c = attempt.classification;
      const banner = c ? failBanner(c) : { kind: "fail", text: "FAIL", sub: firstLine(d.reason || d.error) };
      return { ...s, attempt, banner };
    }
    case "world.bumped":
      return { ...s, banner: { kind: "fail", text: "STOPPED · an object moved", sub: firstLine(d.message) } };
    case "repair.started":
      return { ...s, round: d.round, droid: { round: d.round, via: null, diagnosis: null, change: null, message: null },
               banner: { kind: "repair", text: `DROID REPAIRING · round ${d.round}`, sub: s.banner.kind === "fail" ? s.banner.text : "" } };
    case "droid.started":
      return { ...s, droid: { ...(s.droid || {}), round: d.round, via: d.via } };
    case "droid.message":
      return { ...s, droid: { ...(s.droid || {}), message: firstLine(d.text) } };
    case "droid.result": {
      const r = d.result || {};
      return { ...s, droid: { ...(s.droid || {}), round: d.round, diagnosis: r.diagnosis || null,
                              change: r.change || null, confidence: r.confidence ?? null } };
    }
    case "droid.lesson":
      return { ...s, lesson: d.lesson };
    case "skill.diff":
      return { ...s, version: d.new_version, gates: initialState().gates, approval: null,
               diff: { old_version: d.old_version, new_version: d.new_version, ...shortDiff(d.diff) } };
    case "gate.result": {
      if (!GATES.includes(d.gate)) return s;
      const gates = { ...s.gates, [d.gate]: { state: d.ok ? "ok" : "fail", detail: firstLine(d.detail, 80) } };
      const banner = d.ok ? s.banner : { kind: "fail", text: `GATE FAILED · ${d.gate}`, sub: firstLine(d.detail) };
      return { ...s, gates, banner };
    }
    case "approval.requested": {
      const sum = d.summary || {};
      return { ...s, approval: { state: "pending", kind: "approval", title: sum.title || "", note: "" },
               banner: { kind: "wait", text: "WAITING FOR APPROVAL", sub: sum.title || "" } };
    }
    case "reset.requested":
      return { ...s, approval: { state: "pending", kind: "reset", title: "Reset the table, then press Done", note: "" },
               banner: { kind: "wait", text: "RESET THE TABLE", sub: firstLine(d.message) } };
    case "approval.decided":
      return { ...s, approval: { ...(s.approval || {}), state: d.approved ? "approved" : "rejected", note: d.note || "" },
               banner: d.approved ? s.banner : { kind: "fail", text: "REJECTED", sub: firstLine(d.note) } };
    case "skill.saved":
      return { ...s, saved: { skill: d.skill, version: d.version } };
    case "run.finished": {
      if (!d.ok) {
        return { ...s, finished: d, banner: { kind: "fail", text: `FAILED · after ${d.rounds} round(s)`, sub: s.banner.sub } };
      }
      const parts = ["PASS"];
      if (s.saved) parts.push(`${s.saved.skill} v${s.saved.version} saved`);
      if (s.lesson) parts.push("lesson learned");
      return { ...s, finished: d, banner: { kind: "pass", text: parts.join(" · "), sub: `${d.rounds} repair round(s)` } };
    }
    case "error":
      // dashboard.task = the run itself crashed: it is over, so the Run button comes back.
      return { ...s, finished: d.where === "dashboard.task" ? { ok: false, rounds: s.round } : s.finished, banner: { kind: "error", text: "ERROR", sub: firstLine(`${d.where}: ${d.message}`) } };
    default:
      return s;
  }
}

if (typeof module !== "undefined") module.exports = { initialState, reduce, shortDiff, keyframes };
</script>

<script>
const params = new URLSearchParams(location.search);
const replay = params.get("replay");
const url = replay
  ? `/events?replay=${encodeURIComponent(replay)}&speed=${encodeURIComponent(params.get("speed") || "1")}`
  : "/events";
const $ = (id) => document.getElementById(id);
if (replay) { $("mode").textContent = `RECORDED RUN ${replay}`; $("mode").className = "replay"; }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render(s) {
  $("task").textContent = s.task || "waiting for a task…";
  $("task").className = s.task ? "" : "empty";

  const b = $("banner");
  b.className = s.banner.kind;
  b.replaceChildren(s.banner.text);
  if (s.banner.sub) b.append(el("span", "sub", s.banner.sub));

  $("droid-box").classList.toggle("hidden", !s.droid);
  if (s.droid) {
    $("via").textContent = [`round ${s.droid.round}`, s.droid.via].filter(Boolean).join(" · ");
    $("droid").textContent = s.droid.diagnosis || s.droid.message || "working…";
    $("change").textContent = s.droid.change ? `change: ${s.droid.change}` : "";
  }

  $("diff-box").classList.toggle("hidden", !s.diff);
  if (s.diff) {
    const from = s.diff.old_version == null ? "new skill" : `v${s.diff.old_version}`;
    $("diff-versions").textContent = `${from} → v${s.diff.new_version}`;
    const lines = s.diff.lines.map((l) => el("div", l.kind, l.text));
    if (s.diff.more) lines.push(el("div", "more", `… ${s.diff.more} more changed line(s)`));
    $("diff").replaceChildren(...lines);
  }

  $("gates").replaceChildren(...GATES.map((g) => {
    const gate = s.gates[g];
    const n = el("div", `gate ${gate.state}`);
    n.append(el("span", "light"), el("span", null, g), el("span", "detail", gate.detail));
    return n;
  }));

  const a = s.approval;
  const waiting = !!(a && a.state === "pending") && !replay;
  $("approve").disabled = !waiting;
  $("approve").textContent = a && a.kind === "reset" ? "Done" : "Approve";
  $("reject-box").classList.toggle("hidden", !waiting || a.kind === "reset");
  const running = !!s.run_id && !s.finished;
  $("task-run").disabled = !!replay || running;
  $("task-input").disabled = !!replay;
  $("approval-text").textContent = !a ? ""
    : a.state === "pending" ? (replay ? `${a.title} (recorded run)` : a.title)
    : `${a.state}${a.note ? ": " + a.note : ""}`;

  renderDrawer(s.drawer);
}

const frameUrl = (path) => `/frame?path=${encodeURIComponent(path)}`;
const mark = (ok) => ok == null ? el("span", null, "·") : el("span", ok ? "ok" : "bad", ok ? "✓" : "✗");
const orEmpty = (nodes, text) => nodes.length ? nodes : [el("div", "empty", text)];

function renderDrawer(d) {
  const refused = d.permissions.filter((p) => !p.allowed).length;
  $("drawer-toggle").replaceChildren("Details");
  if (refused) $("drawer-toggle").append(" · ", el("span", "refused", `${refused} refused`));

  $("frames").replaceChildren(...orEmpty(keyframes(d).map((f) => {
    const fig = el("figure", f.ok ? "frame" : "frame bad");
    const img = el("img");
    img.src = frameUrl(f.path);
    img.alt = `${f.phase} key frame`;
    img.onerror = () => img.replaceWith(el("div", "empty", `frame unavailable: ${f.path}`));
    fig.append(img, el("figcaption", null, `attempt ${f.attempt} · v${f.version ?? "?"} · ${f.phase} ${f.ok ? "✓" : "✗"} · ${f.detail}`));
    return fig;
  }), "no key frames yet"));

  $("phases").replaceChildren(...orEmpty(d.attempts.filter((a) => a.phases.length || a.classification).map((a, i) => {
    const box = el("div");
    const c = a.classification;
    box.append(el("div", "caption", `attempt ${i + 1} · ${a.skill ?? "?"} v${a.version ?? "?"} on ${a.env ?? "?"}`
      + (c ? ` · ${c.cls} (${c.bucket}${c.confidence != null ? `, conf ${c.confidence}` : ""})` : "")));
    if (c && c.hint) box.append(el("div", "caption", `hint: ${c.hint}`));
    const table = el("table");
    const head = el("tr");
    ["phase", "", "detail", "calls"].forEach((h) => head.append(el("th", null, h)));
    table.append(head);
    a.phases.forEach((p) => {
      const row = el("tr", p.ok ? null : "failed");
      const cell = el("td"); cell.append(mark(p.ok));
      row.append(el("td", null, p.phase), cell, el("td", null, p.detail), el("td", null, `#${p.start_index}–${p.end_index}`));
      table.append(row);
    });
    box.append(table);
    return box;
  }), "no phase checks yet"));

  $("permissions").replaceChildren(...orEmpty(d.permissions.map((p) => {
    const row = el("div", `step perm ${p.allowed ? "" : "refused"}`);
    row.append(el("span", p.allowed ? "ok" : "bad", p.allowed ? "ALLOWED " : "REFUSED "),
               el("span", null, `r${p.round} ${p.action} ${p.target} `), el("span", "why", `— ${p.reason}`));
    return row;
  }), "no permission requests yet"));

  $("steps").replaceChildren(...orEmpty(d.steps.map((st) => {
    const row = el("div", "step");
    row.append(el("span", "kind", st.kind), mark(st.ok), el("span", null, ` r${st.round} ${st.name}`));
    if (st.text) row.append(el("pre", null, st.text));
    return row;
  }), "no tool calls yet"));

  const ss = d.session;
  $("session").replaceChildren(...(ss ? [
    ["via", ss.via], ["autonomy", ss.autonomy], ["disabled tools", (ss.disabled_tools || []).join(", ") || "none"],
    ["tools Droid can use", (ss.tools || []).join(", ") || "(not reported)"], ["workspace", ss.workspace],
  ].map(([k, v]) => { const r = el("div"); r.append(el("span", "caption", `${k}: `), String(v ?? "")); return r; })
    : [el("div", "empty", "Droid has not started")]));
}

$("drawer-toggle").onclick = () => $("drawer").classList.toggle("hidden");
$("drawer-close").onclick = () => $("drawer").classList.add("hidden");

let state = initialState();
render(state);

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body) });
  if (!r.ok) {
    let detail = `HTTP ${r.status}`;
    try { detail = (await r.json()).detail || detail; } catch (_) { /* not JSON */ }
    throw new Error(detail);
  }
  return r.json();
}

async function decide(approved) {
  $("approve").disabled = true;
  $("reject").disabled = true;
  try {
    await post("/approve", { approved, note: approved ? "" : $("note").value.trim(), run_id: state.run_id });
    $("note").value = "";
  } catch (err) {
    $("approval-text").textContent = `${approved ? "approve" : "reject"} failed: ${err.message}`;
    $("approve").disabled = false;
  }
  $("reject").disabled = false;
}
$("approve").onclick = () => decide(true);
$("reject").onclick = () => decide(false);

$("task-form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("task-input").value.trim();
  if (!text) return;
  $("task-run").disabled = true;
  $("task-msg").textContent = "";
  try {
    await post("/task", { text });
    $("task-input").value = "";
  } catch (err) {
    $("task-msg").textContent = err.message;
    $("task-run").disabled = false;
  }
};

function logEvent(e) {
  const row = el("div", "ev");
  row.append(el("span", "type", e.type), JSON.stringify(e.data).slice(0, 300));
  $("log").append(row);
}

const src = new EventSource(url);
src.onopen = () => {
  // The server resends its history on every (re)connect, so start the story from scratch.
  state = initialState();
  $("log").replaceChildren();
  render(state);
  $("status").textContent = "connected";
};
src.onerror = () => { $("status").textContent = replay ? "replay stopped" : "reconnecting…"; };
src.onmessage = (m) => {
  const e = JSON.parse(m.data);
  logEvent(e);
  state = reduce(state, e);
  render(state);
};
src.addEventListener("replay.end", () => { $("status").textContent = "replay finished"; src.close(); });
</script>
</body>
</html>
