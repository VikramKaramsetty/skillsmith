# Which branch prefix may touch which paths. Enforced by scripts/check_ownership.py in CI
# and in scripts/ship.sh. Branch names: <prefix>/<slug>, e.g. ws2/mujoco-scene.
# A PR labelled `lead-approved` skips the check. `lead/*` branches may touch anything.
# Every workstream may also edit tests/<prefix>/ (added automatically).

lead_branches: [lead]

workstreams:
  ws1:
    title: hardware (robotd + real arm client)
    paths: [robotd/, src/skillsmith/hal/real.py]
  ws2:
    title: kinematics + MuJoCo sim
    paths: [src/skillsmith/kinematics.py, src/skillsmith/hal/sim.py, assets/so101/]
  # WS3 runs as three parallel tracks; perception/__init__.py belongs to the lead.
  ws3a:
    title: perception A, geometry & frames
    paths: [src/skillsmith/perception/frames.py, src/skillsmith/perception/geometry.py, tools/calibrate_camera.py, tests/ws3/]
  ws3b:
    title: perception B, detectors & annotation
    paths: [src/skillsmith/perception/color.py, src/skillsmith/perception/annotate.py, src/skillsmith/perception/vision.py,
            tools/hsv_tuner.py]
  ws3c:
    title: perception C, world model & wrist
    paths: [src/skillsmith/perception/world.py, src/skillsmith/perception/wrist.py]
  ws4:
    title: runtime, safety & failure analysis
    paths: [src/skillsmith/skills/validator.py, src/skillsmith/skills/runtime.py, src/skillsmith/safety.py,
            src/skillsmith/verify.py, src/skillsmith/tasks.py, src/skillsmith/analysis/,
            tests/test_validator.py, tests/test_safety_verify.py]
  ws5:
    title: Droid loop
    paths: [src/skillsmith/repair/, droid_template/, tests/test_repair_loop.py, tests/test_droid_tools.py]
  ws6:
    title: dashboard
    paths: [src/skillsmith/dashboard/]
  ws7:
    title: library & calibration
    paths: [src/skillsmith/calibration/, skills/library/]
  qa:
    title: integration tests
    paths: [tests/integration/]
  docs:
    title: documentation only
    paths: [docs/, README.md]
