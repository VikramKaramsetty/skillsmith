[project]
name = "skillsmith"
version = "0.1.0"
description = "A robot arm that writes its own skills: code-as-policies with Factory Droid"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
sim = ["mujoco>=3.2", "imageio[ffmpeg]>=2.34"]
kin = ["placo>=0.9"]
vision = ["opencv-contrib-python>=4.9", "numpy>=1.26"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
robotd = ["fastapi>=0.110", "uvicorn>=0.29"]  # + LeRobot's feetech driver from ~/robot/.venv on the GX10
droid = ["droid-sdk[mcp]>=0.5"]  # Factory Droid Python SDK: the product's repair agent (docs/NORTH_STAR.md)

[project.scripts]
skillsmith = "skillsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["skills/library", "src/skillsmith/demo/stack_v*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B905"]
