# Stage profile for the live demo: `--profile stage` (or SKILLSMITH_PROFILE=stage).
# Merged on top of robot.yaml. Goal: ONE repair round under 60 s (docs/NORTH_STAR.md "Speed").
repair:
  max_rounds: 2            # one real try + one spare; never a long loop in front of judges
droid:
  sim_tool_budget: 1       # Droid may test its fix in sim once per round; our gates re-check anyway
  timeout_s: 90            # a round that takes longer is cut off; switch to the fallback (docs/DEMO.md)
  # model ladder: robot.yaml's (Haiku medium -> Haiku high for the 2 stage rounds); override here if needed
safety:
  max_tcp_speed: 0.12      # fast through open air (the guard still checks every target)
