# Skillsmith configuration. Owned by the lead. Numbers marked MEASURE are placeholders
# until the first hardware session (see docs/PLAN.md, gate G3 and its signal checklist).

robot:
  follower_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6057566-if00
  leader_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6055440-if00
  calibration_id: follower          # ~/.cache/huggingface/lerobot/calibration/robots/so_follower/follower.json
  robotd_url: http://127.0.0.1:8100
  joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
  urdf: assets/so101/so101_new_calib.urdf      # WS2 vendors this from TheRobotStudio SO-ARM100
  mjcf: assets/so101/scene.xml                 # WS2 vendors from mujoco_menagerie/robotstudio_so101
  ee_frame: gripper_frame_link
  home_xyz: [0.18, 0.0, 0.15]       # MEASURE: safe pose above the middle of the table
  gripper_open: 100
  gripper_closed: 0

cameras:
  wrist: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB2.0_CAM1_USB2.0_CAM1-video-index0
  wrist_size: [640, 480]
  front: http://100.67.242.86:8001/stream    # MacBook stand-in; replace with a fixed overhead webcam
  calibration: config/camera.json             # intrinsics + pose, written by tools/calibrate_camera.py (WS3.2)

world:                              # live world model (WS3.5)
  rate_hz: 12
  bump_threshold: 0.01              # m; a not-held object moving more than this = WorldChanged
  min_confidence: 0.5               # below this a detection is 'uncertain' (confidence gate)

workspace:                          # tip must stay inside this box (robot frame, metres). MEASURE
  x: [0.08, 0.34]
  y: [-0.20, 0.20]
  z: [0.0, 0.25]
  min_reach: 0.08                   # radial distance from the base axis
  max_reach: 0.33

safety:
  min_tip_z: 0.005                  # tip never goes below 5 mm above the table
  max_tcp_speed: 0.15               # m/s
  default_tcp_speed: 0.08
  attempt_timeout_s: 120             # wall-clock limit per attempt; arm stops, error names the line (WS4.2)
  carry_clearance: 0.01              # m: a held object must clear known objects by this (WS4.3)
  max_joint_speed_dps: 60
  max_step_deg: 10                  # robotd per-command clamp (5-10 works; 2 stalled the elbow)
  joint_limit_margin_deg: 2         # robotd refuses goals this close to a calibrated joint limit
  max_lag_deg: 10                   # robotd watchdog: a joint this far behind its goal halts the move
  max_calls: 80                     # primitive calls per attempt (includes nested skills)
  max_skill_depth: 3
  approach_step: 0.02               # vertical moves split into steps this size
  require_sim_before_real: true
  require_approval_before_real: true

verify:
  xy_tol: 0.03
  z_tol: 0.01

repair:
  max_rounds: 4                     # Droid calls per task
  runs_dir: runs
  library_dir: skills/library
  audit_dir: null                   # per-version audit records; null = skills/audit next to the library (WS5.8)
  audit_commit: auto                # commit each saved skill + audit: auto = not on the fake world | always | never
  droid_ws_root: ~/.skillsmith/droid_ws
  lessons_file: skills/lessons.md   # Droid's lessons; every Droid prompt includes it

droid:                              # see docs/NORTH_STAR.md
  mode: sdk                         # sdk = Droid Python SDK (the product) | cli = droid exec fallback
  model: null                       # null = Droid default
  reasoning: null
  timeout_s: 240
  # SDK controls
  # Control = an explicit ALLOWLIST. Droid's only capabilities are these harness tools plus our
  # `skillsmith` functions (added automatically in code): no file, shell, web, automation or
  # sub-agent tools. Autonomy HIGH only means "don't pause for approval", which is safe because
  # nothing reachable is dangerous: `make droid-sandbox-check` proves escapes are blocked.
  # (In this Droid CLI, custom tools are callable only from a Script, and droid-sdk 0.5.0 cannot
  # parse Script permission requests, so at LOW/MEDIUM every tool call was cancelled.)
  autonomy: high
  restrict_tools: [ToolSearch, Script, WaitForScript, TodoWrite]
  disabled_tools: [Execute, AskUser]   # belt and braces: never shell, never mid-run questions
  sim_tool_budget: 3                # simulate_skill calls Droid may make per round
  attach_snapshot: true             # send the failure camera frame as an image
  attach_frames: true               # attach the evidence's key frames as images (WS5.3)
  max_images: 6                     # cap on images attached per round
  # CLI fallback only
  bin: droid
  auto: low
  remove_tools: [Execute]

dashboard:                          # `skillsmith serve` (WS6)
  env: fake                         # target env for tasks started from the page: fake | sim | real
  author: droid                     # droid (the product) | scripted (tests only)
  approval_timeout_s: 600           # no click in time = REJECT, never approve
