# Mac profile: the arm, its leader and both cameras plugged into a Mac instead of the GX10.
#   robotd:     ~/robot/.venv/bin/python -m robotd --profile mac     (LeRobot venv, like the GX10)
#   everything: skillsmith --profile mac ...   (demo speed too: --profile mac,stage)
# or `export SKILLSMITH_PROFILE=mac` once per terminal. Merged on top of robot.yaml.
# VERIFY values come from `ls /dev/cu.*` and `python tools/list_cameras.py` (SETUP.md "Arm on a Mac").
robot:
  follower_port: /dev/cu.usbmodem5AE60575661   # VERIFY: follower (12 V arm), CH343 serial 5AE6057566
  leader_port: /dev/cu.usbmodem5AE60554401     # VERIFY: leader (~5.5 V arm), CH343 serial 5AE6055440
cameras:
  front: 0                                     # VERIFY: overhead camera's OpenCV index
  front_size: [1280, 720]
  wrist: 1                                     # VERIFY: wrist camera's OpenCV index
